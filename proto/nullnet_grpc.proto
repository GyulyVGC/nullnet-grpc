syntax = "proto3";

package nullnet_grpc;

service NullnetGrpc {
  // TAP-based clients APIs --------------------------------------------------------------------------------------------

  // Control channel
  rpc ControlChannel(stream MsgId) returns (stream VxlanMessage);

  // Services list
  rpc ServicesList(Services) returns (Empty);

  // Proxy-based clients APIs ------------------------------------------------------------------------------------------

  // Proxy
  rpc Proxy(ProxyRequest) returns (Upstream);
}

// TAP-based clients ---------------------------------------------------------------------------------------------------

message VxlanMessage {
  oneof message {
    VxlanSetup vxlan_setup = 1;
    VxlanTeardown vxlan_teardown = 2;
  }
}

message VxlanSetup {
  MsgId msg_id = 1;
  uint32 vxlan_id = 2;
  string ns_name = 3;
  string ns_net = 4;
  string br_name = 5;
  string br_net = 6;
  string local_ip = 7;
  string remote_ip = 8;
  optional HostMapping host_mapping = 9;
}

message VxlanTeardown {
  string ns_name = 1;
  string br_name = 2;
}

message MsgId {
  string id = 1;
}

message Services {
  repeated Service services = 1;
}

message Service {
  string name = 1;
  uint32 port = 2;
}

message HostMapping {
  string ip = 1;
  string name = 2;
}

// Proxy-based clients -------------------------------------------------------------------------------------------------

message ProxyRequest {
  string client_ip = 1;
  string service_name = 2;
}

message Upstream {
  string ip = 1;
  uint32 port = 2;
}

// Misc ----------------------------------------------------------------------------------------------------------------

message Empty { }