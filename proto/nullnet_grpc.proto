syntax = "proto3";

package nullnet_grpc;

service NullnetGrpc {
  // TAP-based clients APIs --------------------------------------------------------------------------------------------

  // Network type declaration
  rpc NetworkType(Empty) returns (NetType);

  // Services list
  rpc ServicesList(Services) returns (Empty);

  // Control channel
  rpc ControlChannel(stream MsgId) returns (stream NetMessage);

  // Proxy-based clients APIs ------------------------------------------------------------------------------------------

  // Proxy
  rpc Proxy(ProxyRequest) returns (Upstream);
}

// TAP-based clients ---------------------------------------------------------------------------------------------------

message NetType {
   Net net = 1;
}

enum Net {
  VLAN = 0;
  VXLAN = 2;
}

message NetMessage {
  oneof message {
    // VLAN setup and teardown
    VlanSetup vlan_setup = 1;
    VlanTeardown vlan_teardown = 2;
    // VXLAN setup and teardown
    VxlanSetup vxlan_setup = 3;
    VxlanTeardown vxlan_teardown = 4;
  }
}

message VlanSetup {
  MsgId msg_id = 1;
  uint32 vlan_id = 2;
  string local_veth = 3;
  string remote_veth = 4;
  string local_ip = 5;
  string remote_ip = 6;
  optional HostMapping host_mapping = 7;
}

message VlanTeardown {
  uint32 vlan_id = 1;
  string veth_name = 2;
}

message VxlanSetup {
  MsgId msg_id = 1;
  uint32 vxlan_id = 2;
  string ns_name = 3;
  string ns_net = 4;
  string br_name = 5;
  string br_net = 6;
  string local_ip = 7;
  string remote_ip = 8;
  optional HostMapping host_mapping = 9;
}

message VxlanTeardown {
  string ns_name = 1;
  string br_name = 2;
}

message MsgId {
  string id = 1;
}

message Services {
  repeated Service services = 1;
}

message Service {
  string name = 1;
  uint32 port = 2;
}

message HostMapping {
  string ip = 1;
  string name = 2;
}

// Proxy-based clients -------------------------------------------------------------------------------------------------

message ProxyRequest {
  string client_ip = 1;
  string service_name = 2;
}

message Upstream {
  string ip = 1;
  uint32 port = 2;
}

// Misc ----------------------------------------------------------------------------------------------------------------

message Empty { }